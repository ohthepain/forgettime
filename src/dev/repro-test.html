<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Disposable recorder checks</title><style>body{font:16px system-ui;background:#eee;color:#18212a;padding:24px;max-width:650px}label{display:block;margin:12px 0}button,input,select{font:inherit;padding:8px}section{margin:20px 0}.waveform-detail{height:120px;background:#cde;padding:12px}footer{margin-top:800px}</style></head><body>
<h1>Disposable recorder checks</h1><p>No app storage or audio is used.</p>
<section id="rerender"></section>
<form id="form"><label>Import tempo <input id="fixture-tempo" aria-label="Import tempo" type="number" min="30" max="300" value="100"></label><label>Password <input id="fixture-password" aria-label="Password" type="password"></label><label>Personal note <input id="fixture-note" aria-label="Personal note"></label><label>Detector family <select aria-label="Detector family"><option>Current detector</option><option>Mel detector</option></select></label><label><input type="checkbox" aria-label="Test toggle">Test toggle</label><button type="submit">Apply fixture settings</button></form>
<button id="navigate">Other fixture page</button><p id="result" role="status">Ready</p>
<div class="waveform-detail" aria-label="Fixture waveform"><button role="button" aria-label="Select desired attack 1 seconds">Marker</button><button class="waveform-marker-play" aria-label="Play selected region">Play</button></div>
<div class="tutorial-panel" style="position:static"><button>Tutorial Next</button></div><footer>Scroll endpoint</footer>
<script>let count=0;function redraw(){const b=document.createElement('button');b.textContent='Repeated action';b.onclick=()=>{count++;document.getElementById('result').textContent='Clicks '+count;redraw()};document.getElementById('rerender').replaceChildren(b)}redraw();document.getElementById('form').onsubmit=e=>{e.preventDefault();document.getElementById('result').textContent='Applied'};document.getElementById('navigate').onclick=()=>{history.pushState({},'',location.pathname.endsWith('/other')?'/__repro-test':'/__repro-test/other');document.querySelector('h1').textContent='Other disposable page';window.dispatchEvent(new Event('forgettime-route-changed'))}</script>
<script type="module" src="/src/dev/repro-steps.tsx"></script></body></html>
